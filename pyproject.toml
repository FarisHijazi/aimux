[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uzi"
version = "0.2.0"
description = "AI coding agent orchestration tool"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Uzi Team"}
]
maintainers = [
    {name = "Uzi Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
]

[project.urls]
Homepage = "https://github.com/FarisHijazi/aimux"
Documentation = "https://github.com/FarisHijazi/aimux"
Repository = "https://github.com/FarisHijazi/aimux"
Issues = "https://github.com/FarisHijazi/aimux/issues"

[project.scripts]
uzi = "uzi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["uzi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["uzi"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
